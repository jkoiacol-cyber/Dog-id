<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome Aruba</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            height:100vh;
            overflow:hidden;

            display:flex;
            justify-content:center;
            align-items:center;

            font-family:'Poppins',sans-serif;
            color:white;
            text-align:center;

            background:#000;
        }

        .overlay {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.30),
                    rgba(0, 0, 0, 0.55)
                );

            backdrop-filter: blur(2px);
        }

        .content {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 1400px;
            margin: auto;
            padding: 30px;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        h1 {
            font-size: clamp(2rem, 4vw, 3.5rem);
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        #guest {
            font-size: 5rem;
            font-weight: 300;
            margin-bottom: 25px;
        }

        #message {
            font-size: 1.8rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        #clock {
            font-size: 1.4rem;
            margin-bottom: 40px;
            opacity: 0.95;
        }

        .info-card {
            width: fit-content;
            margin: auto;

            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);

            border-radius: 20px;

            padding: 20px 40px;

            text-align: left;

            font-size: 1.2rem;
            line-height: 2;
        }

        .footer {
            margin-top: 40px;
            font-size: 1.1rem;
            opacity: 0.9;
            letter-spacing: 1px;
        }

        @media (max-width: 1200px) {

            h1 {
                font-size: 3rem;
            }

            #guest {
                font-size: 4rem;
            }

            #message {
                font-size: 1.5rem;
            }
            
        
        }


        .qr-container {

            position: absolute;

            right: 40px;

            bottom: 40px;

            z-index: 20;

            text-align: center;

            background: rgba(255,255,255,0.12);

            backdrop-filter: blur(10px);

            padding: 15px;

            border-radius: 20px;
        }

        .qr-container img {

            width: 180px;

            height: 180px;

            display: block;
        }

        .qr-text {

            margin-top: 10px;

            font-size: 1rem;

            color: white;
        }

        .background{

            position:fixed;

            top:0;
            left:0;

            width:100%;
            height:100%;

            background-size:cover;
            background-position:center center;
            background-repeat:no-repeat;

            opacity:0;

            transition:opacity 2.5s ease-in-out;

            z-index:-2;
        }

        .background.active{
            opacity:1;
        }

        #muteBtn{

            position:absolute;

            bottom:40px;
            left:40px;

            width:70px;
            height:70px;

            border:none;

            border-radius:50%;

            background:rgba(255,255,255,.15);

            backdrop-filter:blur(10px);

            color:white;

            font-size:30px;

            cursor:pointer;

            z-index:100;
        }

        #muteBtn:hover{
            background:rgba(255,255,255,.25);
        }

        /* Widget del Tiempo en la esquina superior derecha */
        .weather-card {
            position: absolute;
            top: 40px;
            right: 40px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 12px 25px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        .weather-icon {
            font-size: 2.2rem;
        }

        .weather-temp {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .weather-desc {
            font-size: 0.9rem;
            opacity: 0.85;
            text-align: left;
        }
    
    </style>

</head>

<body>

    <audio id="oceanAudio" loop>
        <source src="audio/ocean.mp3" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
    </audio>

    <div id="bg1" class="background active"></div>
    <div id="bg2" class="background"></div>

    <div class="overlay"></div>

    <div class="qr-container">
        <img id="qrCode" alt="QR Aruba Guide">

        <div class="qr-text">
            Scan to discover Aruba
        </div>
    </div>

    <button id="muteBtn">
        🔊
    </button>

    <!-- Widget del Tiempo para Aruba -->
    <div class="weather-card">
        <div class="weather-icon" id="weatherIcon">☀️</div>
        <div>
            <div class="weather-temp" id="weatherTemp">--°C</div>
            <div class="weather-desc" id="weatherDesc">Cargando clima...</div>
        </div>
    </div>

    <div class="content">

        <h1 id="welcome"></h1>

        <div id="guest"></div>

        <div id="message"></div>

        <div id="clock"></div>


        <div class="info-card">

            <div id="wifi"></div>

            <div id="password"></div>

            <div id="phone"></div>

            <div id="checkout"></div>

        </div>

        <div class="footer">
            🌴 Aruba Paradise Stay
        </div>

    </div>

    <script>

        // Cargar la configuración guardada en el servidor
        async function cargarConfiguracionServidor() {
            try {
                const res = await fetch('config.json?v=' + new Date().getTime()); // Evita caché
                if (res.ok) {
                    const config = await res.json();
                    
                    // Aplicar datos guardados
                    if (config.name) document.getElementById("guest").textContent = config.name;
                    if (config.lang && translations[config.lang]) {
                        document.getElementById("welcome").textContent = translations[config.lang].welcome;
                        document.getElementById("message").textContent = translations[config.lang].message;
                    }
                    if (config.wifi) document.getElementById("wifi").textContent = `📶 WiFi: ${config.wifi}`;
                    if (config.pass) document.getElementById("password").textContent = `🔐 Password: ${config.pass}`;
                    if (config.phone) document.getElementById("phone").textContent = `📱 Host WhatsApp: ${config.phone}`;
                    if (config.checkout) document.getElementById("checkout").textContent = `🔑 Check-out: ${config.checkout}`;
                    if (config.guide) {
                        document.getElementById("qrCode").src = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(config.guide)}`;
                    }
                }
            } catch (e) {
                console.log("Usando valores por defecto o de la URL", e);
            }
        }

        cargarConfiguracionServidor();

        const params = new URLSearchParams(window.location.search);

        const guest =
            params.get("name") || "Nuestros Invitados";

        const lang =
            params.get("lang") || "es";

        const wifi =
            params.get("wifi") || "Aruba Paradise";

            const password =
            params.get("pass") || "WelcomeAruba2026";

            const phone =
            params.get("phone") || "+297 XXX XXXX";

            const checkout =
            params.get("checkout") || "11:00";

            const guide =
            params.get("guide") ||
            "https://guide.arubaparadisestay.com";

        const translations = {

            es: {
                welcome: "Bienvenidos a Aruba",
                message: "Esperamos que disfrutéis de una estancia inolvidable."
            },

            en: {
                welcome: "Welcome to Aruba",
                message: "We hope you enjoy an unforgettable stay."
            },

            de: {
                welcome: "Willkommen auf Aruba",
                message: "Wir wünschen Ihnen einen unvergesslichen Aufenthalt."
            },

            nl: {
                welcome: "Welkom op Aruba",
                message: "Wij hopen dat jullie een onvergetelijk verblijf hebben."
            }

        };

        document.getElementById("guest").textContent = guest;

        document.getElementById("welcome").textContent =
            translations[lang].welcome;

        document.getElementById("message").textContent =
            translations[lang].message;

        document.getElementById("qrCode").src =
        `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(guide)}`;

        document.addEventListener("click", () => {
            audio.play().catch(() => {});
        }, { once: true });

        document.getElementById("wifi").textContent =
            `📶 WiFi: ${wifi}`;

            document.getElementById("password").textContent =
            `🔐 Password: ${password}`;

            document.getElementById("phone").textContent =
            `📱 Host WhatsApp: ${phone}`;

            document.getElementById("checkout").textContent =
            `🔑 Check-out: ${checkout}`;


        function updateClock() {

            const now = new Date();

            const options = {
                weekday: 'long',
                day: 'numeric',
                month: 'long',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };

            document.getElementById("clock").textContent =
                now.toLocaleDateString(lang, options);

        }

        updateClock();

        setInterval(updateClock, 1000);


        const backgrounds = [
            "images/Eagle_Beach.jpg",
            "images/Baby_Beach.jpg",
            "images/Palm_Beach.jpg",
            "images/california-aruba.jpg"
        ];

        const bg1 = document.getElementById("bg1");
        const bg2 = document.getElementById("bg2");

        let current = 0;
        let showingBg1 = true;

        /* Primera imagen instantánea */

        bg1.style.backgroundImage =
            `url('${backgrounds[0]}')`;

        bg1.classList.add("active");

        /* Precarga todas */

        backgrounds.forEach(src => {

            const img = new Image();
            img.src = src;

        });

        /* Crossfade */

        setInterval(() => {

            current = (current + 1) % backgrounds.length;

            const nextImage =
                `url('${backgrounds[current]}')`;

            if(showingBg1){

                bg2.style.backgroundImage = nextImage;

                bg2.classList.add("active");
                bg1.classList.remove("active");

            }else{

                bg1.style.backgroundImage = nextImage;

                bg1.classList.add("active");
                bg2.classList.remove("active");

            }

            showingBg1 = !showingBg1;

        }, 15000);

        //Sonido ambiental
        
    const audio = document.getElementById("oceanAudio");
    audio.volume = 0.10; // Prueba con 0.10 (10%) o 0.08 (8%) si lo quieres más tenue todavía.

    const muteBtn = document.getElementById("muteBtn");

    // Función para arrancar el audio con la primera interacción del usuario (política de los navegadores)
    function iniciarAudio() {
        audio.play().then(() => {
            console.log("Audio iniciado correctamente");
            muteBtn.innerHTML = "🔊";
        }).catch(err => {
            console.log("Esperando interacción del usuario para reproducir audio", err);
        });
        // Remover el evento para que solo se ejecute la primera vez
        document.removeEventListener("click", iniciarAudio);
        document.removeEventListener("keydown", iniciarAudio);
    }

    document.addEventListener("click", iniciarAudio, { once: true });
    document.addEventListener("keydown", iniciarAudio, { once: true });

    // Control del botón de Mute / Unmute
    muteBtn.addEventListener("click", async (e) => {
        e.stopPropagation(); // Evita conflictos con el evento global de clic
        try {
            if (audio.paused) {
                await audio.play();
                audio.muted = false;
                muteBtn.innerHTML = "🔊";
            } else {
                audio.muted = !audio.muted;
                muteBtn.innerHTML = audio.muted ? "🔇" : "🔊";
            }
        } catch (err) {
            console.error("Error al controlar el audio:", err);
        }
    });

    // Obtener el clima en tiempo real de Aruba (Oranjestad)
async function fetchArubaWeather() {
    try {
        // Coordenadas de Oranjestad, Aruba: Lat 12.524, Lon -70.027
        const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=12.524&longitude=-70.027&current_weather=true");
        const data = await res.json();
        
        if (data && data.current_weather) {
            const temp = Math.round(data.current_weather.temperature);
            const code = data.current_weather.weathercode;
            
            document.getElementById("weatherTemp").textContent = `${temp}°C`;
            
            // Traducción de códigos WMO a icono y texto
            let desc = "Soleado";
            let icon = "☀️";
            
            if (code === 0) { desc = "Cielo despejado"; icon = "☀️"; }
            else if (code >= 1 && code <= 3) { desc = "Parcialmente nublado"; icon = "⛅"; }
            else if (code >= 45 && code <= 48) { desc = "Niebla"; icon = "🌫️"; }
            else if (code >= 51 && code <= 67) { desc = "Lluvia ligera"; icon = "🌦️"; }
            else if (code >= 80 && code <= 82) { desc = "Chubascos"; icon = "🌧️"; }
            else if (code >= 95) { desc = "Tormenta"; icon = "⛈️"; }
            
            document.getElementById("weatherIcon").textContent = icon;
            document.getElementById("weatherDesc").textContent = desc;
        }
    } catch (err) {
        console.error("Error al obtener el clima:", err);
        document.getElementById("weatherDesc").textContent = "Aruba 29°C";
    }
}

// Cargar el clima al iniciar y actualizar cada 15 minutos
fetchArubaWeather();
setInterval(fetchArubaWeather, 15 * 60 * 1000);

    </script>  

</body>

</html>
