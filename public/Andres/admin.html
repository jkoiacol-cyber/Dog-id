<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Welcome Aruba TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Librería oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 700px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { font-size: 1.8rem; margin-bottom: 20px; text-align: center; color: #38bdf8; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.95rem; margin-bottom: 8px; color: #cbd5e1; }
        input, select, textarea { width: 100%; padding: 12px 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; font-size: 1rem; }
        input:focus, select:focus { outline: none; border-color: #38bdf8; }
        .btn { display: block; width: 100%; padding: 14px; background: #0ea5e9; color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: background 0.3s; margin-top: 20px; }
        .btn:hover { background: #0284c7; }
        #authSection, #appSection { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- SECCIÓN DE AUTENTICACIÓN (LOGIN) -->
        <div id="authSection">
            <h1>Acceso Administrador</h1>
            <form id="loginForm" onsubmit="iniciarSesion(event)">
                <div class="form-group">
                    <label>Correo Electrónico:</label>
                    <input type="email" id="loginEmail" required placeholder="tu@correo.com">
                </div>
                <div class="form-group">
                    <label>Contraseña:</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn">Entrar al Panel</button>
            </form>
        </div>

        <!-- PANEL DE CONTROL (OCULTO HASTA INICIAR SESIÓN) -->
        <div id="appSection">
            <h1>Panel de Control - Smart TV Aruba</h1>
            
            <form id="configForm" onsubmit="guardarConfiguracion(event)">
                <div class="form-group">
                    <label>Nombre del Huésped / Familia:</label>
                    <input type="text" id="guestName" required>
                </div>

                <div class="form-group">
                    <label>Idioma de Bienvenida:</label>
                    <select id="langSelect">
                        <option value="en">English</option>
                        <option value="es">Español</option> 
                        <option value="nl">Nederlands</option>                     
                        <option value="de">Deutsch</option>                        
                    </select>
                </div>

                <div class="form-group">
                    <label>Nombre de la Red WiFi:</label>
                    <input type="text" id="wifiName">
                </div>

                <div class="form-group">
                    <label>Contraseña del WiFi:</label>
                    <input type="text" id="wifiPass">
                </div>

                <div class="form-group">
                    <label>Teléfono / WhatsApp del Host:</label>
                    <input type="text" id="phone">
                </div>

                <div class="form-group">
                    <label>Hora de Check-out:</label>
                    <input type="text" id="checkout">
                </div>

                <div class="form-group">
                    <label>URL de la Guía Digital (para el QR de la TV):</label>
                    <input type="url" id="guideUrl">
                </div>

                <button type="submit" class="btn">Actualizar Pantalla de la TV</button>
            </form>

            <!-- SECCIÓN DESPLEGABLE: GESTIÓN DE DISPOSITIVOS Y LICENCIAS -->
            <details style="margin-top: 30px; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer;">
                <summary style="color: #38bdf8; font-size: 1.1rem; font-weight: 600; outline: none; user-select: none;">
                    📺 Gestionar Dispositivos Vinculados
                </summary>
                
                <div style="margin-top: 15px; cursor: default;">
                    <p id="licenseInfo" style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 15px;">
                        Cargando información de licencias...
                    </p>

                    <div id="devicesList">
                        <!-- Se llena dinámicamente con JS -->
                    </div>

                    <div id="unbindWarning" style="font-size: 0.85rem; color: #cbd5e1; background: rgba(56, 189, 248, 0.1); padding: 12px; border-radius: 10px; border-left: 4px solid #38bdf8; margin-top: 15px;">
                        ℹ️ Tienes <strong id="remainingUnbinds">2</strong> cambios de dispositivo restantes.
                    </div>
                </div>
            </details>
            
            <button class="btn" style="background: #ef4444; margin-top: 15px;" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </div>
    <!-- Enlazamos el archivo JS externo -->
    <script src="admin.js"></script>
</body>
</html>
